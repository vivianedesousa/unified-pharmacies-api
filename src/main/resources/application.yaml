Spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/unifiedpharmacies_db
    username: unifiedpharmacies_user
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
mailtrap:
  token: ${MAILTRAP_TOKEN}
  inbox-id: ${MAILTRAP_INBOX_ID}
  from-email: ${MAILTRAP_FROM_EMAIL}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000