services:

  postgres:
    container_name: unifiedpharmacies-postgres
    image: postgres:16

    environment:
      POSTGRES_DB: unifiedpharmacies_db
      POSTGRES_USER: unifiedpharmacies_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - unifiedpharmacies-network


  pgadmin:
    container_name: unifiedpharmacies-pgadmin4
    image: dpage/pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: adm@unifiedpharmacies.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5051:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - unifiedpharmacies-network


  api:
    container_name: unifiedpharmacies-api
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      MAILTRAP_TOKEN: ${MAILTRAP_TOKEN}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID}
      MAILTRAP_FROM_EMAIL: ${MAILTRAP_FROM_EMAIL}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres

    networks:
      - unifiedpharmacies-network


volumes:
  postgres_data:
  pgadmin_data:


networks:
  unifiedpharmacies-network:
    driver: bridge


































